name: {{app_name}}
description: {{description}}
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^9.2.4
  go_router: ^16.3.0
  intl: any
  logging: ^1.3.0
  {{#use_sentry}}sentry_flutter: ^9.24.0{{/use_sentry}}

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

# path_provider_android 2.3.x pulls jni 1.0.1, which cannot configure AGP 9.
dependency_overrides:
  path_provider_android: 2.2.22

flutter:
  generate: true
  uses-material-design: true
